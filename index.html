<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="Packet prototype: automated data unification for an undocumented hybrid site. Simulated data.">
<title>Packet · Demo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: fixed left nav, header rule, scrolling main. Single light theme by design (Packet.io tokens v2). */
:root{
  --paper:#FBFBF9;--panel:#FFFFFF;--panel-2:#F4F5F2;--rule:#E6E9ED;--rule-strong:#D3D8DE;
  --ink:#0E1116;--muted:#5B6470;--faint:#9BA3AE;
  --signal:#1F5FCC;--signal-hover:#1A52B3;--signal-soft:#8CB2F2;--deep:#0A2F6B;--tint:#EDF2FC;
  --night:#0B0E13;--night-2:#12161D;--night-3:#1A1F28;--night-rule:rgba(255,255,255,.08);--night-text:#E8EBEF;--night-muted:#8B94A1;
  --ok:#1A7A40;--ok-tint:#EAF6EE;--warn:#A66300;--warn-tint:#FDF3E3;--bad:#B00020;--bad-tint:#FBE9EC;
  --display:'Inter Tight','Inter',ui-sans-serif,system-ui,sans-serif;
  --body:'Inter',ui-sans-serif,system-ui,-apple-system,sans-serif;
  --mono:'JetBrains Mono','SFMono-Regular',Consolas,monospace;
  --r-xs:4px;--r-sm:6px;--r-md:8px;--r-lg:12px;
  --ease:cubic-bezier(.2,.7,.2,1);
  --nav-w:224px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:inherit}
code{font-family:var(--mono);font-size:12px;background:var(--tint);color:var(--deep);padding:2px 6px;border-radius:var(--r-xs);white-space:nowrap}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.label{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--faint);font-weight:500}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--display);font-weight:560;letter-spacing:-.02em;margin:0;text-wrap:balance}
h1{font-size:28px;line-height:1.15;letter-spacing:-.025em}
h2{font-size:18px;line-height:1.25}
h3{font-size:15px;line-height:1.3;font-weight:560}
p{margin:0;color:var(--muted);max-width:64ch}
p.ink{color:var(--ink)}
.lede{font-size:16px;line-height:1.55;max-width:56ch}
:focus-visible{outline:2px solid var(--signal);outline-offset:2px}

/* ---- Shell ---- */
.app{display:grid;grid-template-columns:var(--nav-w) 1fr;min-height:100%}
.nav{border-right:1px solid var(--rule);background:var(--paper);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:18px 0 14px}
.brand{display:flex;align-items:baseline;gap:8px;padding:0 20px 18px;border-bottom:1px solid var(--rule)}
.brand b{font-family:var(--display);font-weight:600;font-size:16px;letter-spacing:-.02em}
.brand span{font-family:var(--mono);font-size:10.5px;color:var(--faint)}
.navgroup{padding:16px 12px 6px}
.navgroup .label{padding:0 8px 8px;display:block}
.navitem{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:7px 8px;border-radius:var(--r-sm);color:var(--muted);font-size:13.5px;border:1px solid transparent}
.navitem i{font-family:var(--mono);font-size:10.5px;color:var(--faint);width:18px;font-style:normal}
.navitem:hover{color:var(--ink)}
.navitem.is-active{color:var(--ink);background:var(--panel);border-color:var(--rule)}
.navfoot{margin-top:auto;padding:12px 20px 0;border-top:1px solid var(--rule);display:grid;gap:8px}
.navfoot .label{display:block}
.main{min-width:0;display:flex;flex-direction:column}
.head{position:sticky;top:0;z-index:5;background:rgba(251,251,249,.92);backdrop-filter:blur(6px);border-bottom:1px solid var(--rule);display:flex;align-items:center;gap:14px;padding:12px 32px;min-height:56px}
.head .crumb{font-family:var(--mono);font-size:11px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.head .crumb b{color:var(--ink);font-weight:500}
.head .sp{flex:1}
.guided{display:flex;align-items:center;gap:8px}
.guided .step{font-family:var(--mono);font-size:11px;color:var(--faint);min-width:52px;text-align:center}
.screen{padding:32px 32px 48px;padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:max(32px,env(safe-area-inset-right,0px));display:grid;gap:28px;align-content:start;flex:1}
.screen.is-wide{padding-left:0;padding-right:0}
.foot{border-top:1px solid var(--rule);padding:12px 32px;font-family:var(--mono);font-size:10.5px;color:var(--faint);display:flex;justify-content:space-between;gap:12px}
.titlebar{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap}
.titlebar .lede{margin-top:8px}
.titlebar .actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* ---- Chips, tags, buttons ---- */
.chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;letter-spacing:.02em;padding:4px 9px;border:1px solid var(--rule-strong);border-radius:var(--r-sm);color:var(--muted);background:var(--panel);white-space:nowrap}
.chip .dot{width:6px;height:6px;border-radius:50%;background:var(--ok);display:inline-block}
.chip--ro .dot{background:var(--ok)}
.chip--gate .dot{background:var(--warn)}
.chip--on{border-color:var(--ink);color:var(--ink)}
.chip--filter{cursor:pointer}
.chip--filter:hover{border-color:var(--ink)}
.chip--filter.is-on{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.tag{display:inline-block;font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;padding:3px 7px;border-radius:var(--r-xs);background:var(--panel-2);color:var(--muted);white-space:nowrap}
.tag--pilot{background:var(--tint);color:var(--deep)}
.tag--ok{background:var(--ok-tint);color:var(--ok)}
.tag--warn{background:var(--warn-tint);color:var(--warn)}
.tag--bad{background:var(--bad-tint);color:var(--bad)}
.tag--ink{background:var(--ink);color:var(--panel)}
.btn{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:var(--r-md);border:1px solid var(--rule-strong);background:var(--panel);font-size:13px;font-weight:500;color:var(--ink);white-space:nowrap;transition:border-color .15s,color .15s,background .15s}
.btn:hover{border-color:var(--ink)}
.btn--primary{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.btn--primary:hover{background:#1c2129}
.btn--sm{padding:5px 10px;font-size:12px;border-radius:var(--r-sm)}
.btn[disabled]{opacity:.45;cursor:default;border-color:var(--rule)}
.btn[disabled]:hover{border-color:var(--rule)}
.link{background:none;border:0;padding:0;color:var(--ink);text-decoration:underline;text-decoration-color:var(--rule-strong);text-underline-offset:3px;cursor:pointer;font-size:inherit}
.link:hover{text-decoration-color:var(--ink)}
.link--signal{color:var(--signal);text-decoration-color:var(--signal-soft)}
.input{padding:7px 10px;border:1px solid var(--rule-strong);border-radius:var(--r-sm);background:var(--panel);font-size:13px;min-width:0}
.input:focus{outline:0;border-color:var(--signal);box-shadow:0 0 0 3px rgba(31,95,204,.18)}
select.input{appearance:auto}
.segs{display:inline-flex;border:1px solid var(--rule-strong);border-radius:var(--r-sm);overflow:hidden}
.segs button{padding:6px 11px;font-size:12.5px;color:var(--muted);border-right:1px solid var(--rule)}
.segs button:last-child{border-right:0}
.segs button.is-on{background:var(--ink);color:var(--panel)}
.switch{display:inline-flex;align-items:center;gap:10px;font-size:13px;color:var(--ink)}
.switch i{width:30px;height:16px;border-radius:8px;border:1px solid var(--rule-strong);position:relative;background:var(--panel);transition:background .2s,border-color .2s}
.switch i::after{content:"";position:absolute;top:2px;left:2px;width:10px;height:10px;border-radius:50%;background:var(--faint);transition:transform .2s,background .2s}
.switch.is-on i{background:var(--ink);border-color:var(--ink)}
.switch.is-on i::after{transform:translateX(14px);background:var(--panel)}
.radio{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--rule);cursor:pointer}
.radio:first-child{border-top:1px solid var(--ink)}
.radio i{flex:none;width:14px;height:14px;border-radius:50%;border:1px solid var(--rule-strong);margin-top:3px;position:relative}
.radio.is-on i{border-color:var(--ink)}
.radio.is-on i::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--ink)}
.radio b{display:block;font-weight:500;color:var(--ink)}
.radio span{color:var(--muted);font-size:13px}
.check{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--rule);font-size:13.5px}
.check:first-child{border-top:1px solid var(--ink)}
.check i{width:14px;height:14px;border:1px solid var(--rule-strong);border-radius:3px;display:grid;place-items:center;font-style:normal;font-size:10px;color:var(--panel);flex:none}
.check.is-on i{background:var(--ink);border-color:var(--ink)}
.check.is-on i::before{content:"✓"}
.check .mono{margin-left:auto;color:var(--faint);font-size:11px}

/* ---- Stats and strips ---- */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));border-top:1px solid var(--ink)}
.stats>div{padding:14px 16px 16px 0;border-bottom:1px solid var(--rule)}
.stats>div+div{padding-left:16px;border-left:1px solid var(--rule)}
.stats b{display:block;font-family:var(--display);font-size:26px;font-weight:560;letter-spacing:-.03em;margin-top:4px;font-variant-numeric:tabular-nums;line-height:1.1}
.stats b.is-live{color:var(--signal)}
.stats small{display:block;font-size:12px;color:var(--faint);margin-top:4px}
.strip{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--ink);border-bottom:1px solid var(--rule)}
.strip>div{padding:16px 16px 16px 0;position:relative}
.strip>div+div{padding-left:20px;border-left:1px solid var(--rule)}
.strip>div+div::before{content:"→";position:absolute;left:-7px;top:16px;font-family:var(--mono);font-size:11px;color:var(--faint);background:var(--paper);padding:0 2px}
.strip h3{margin-top:6px}
.strip p{font-size:13px;margin-top:4px}

/* ---- Tables ---- */
.tbl{width:100%;border-collapse:collapse;border-top:1px solid var(--ink);font-size:13px}
.tbl th{text-align:left;font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);font-weight:500;padding:9px 10px 9px 0;border-bottom:1px solid var(--rule);white-space:nowrap}
.tbl td{padding:9px 10px 9px 0;border-bottom:1px solid var(--rule);vertical-align:middle}
.tbl th+th,.tbl td+td{padding-left:10px}
.tbl td.r,.tbl th.r{text-align:right}
.tbl tr.is-click{cursor:pointer}
.tbl tr.is-click:hover td{background:var(--panel-2)}
.tbl tr.is-sel td{background:var(--tint)}
.tbl td .mono{font-size:12px}
.tblwrap{overflow-x:auto;min-width:0}
.live{color:var(--signal);font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums}

/* ---- Panels and grids ---- */
.panel{background:var(--panel);border:1px solid var(--rule);border-radius:var(--r-lg);min-width:0}
.panel__head{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--rule)}
.panel__head b{font-weight:500;font-size:13.5px}
.panel__head .sp{flex:1}
.panel__body{padding:16px}
.well{background:var(--panel-2);border-radius:var(--r-lg);padding:16px;min-width:0}
.cols{display:grid;gap:24px;min-width:0}
.cols-2{grid-template-columns:1fr 1fr}
.cols-3{grid-template-columns:repeat(3,1fr)}
.cols-12{grid-template-columns:repeat(12,1fr)}
.span-4{grid-column:span 4}.span-5{grid-column:span 5}.span-6{grid-column:span 6}.span-7{grid-column:span 7}.span-8{grid-column:span 8}.span-12{grid-column:span 12}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:6px 18px;font-size:13px;align-items:baseline}
.kv .label{padding-top:2px}
.kv .kvv{color:var(--ink)}
.rowlist{border-top:1px solid var(--ink)}
.rowlist>div{display:flex;gap:16px;align-items:center;padding:10px 0;border-bottom:1px solid var(--rule);font-size:13px}
.rowlist .sp{flex:1}
.sec-title{display:flex;align-items:baseline;gap:12px;margin-bottom:12px}
.sec-title .label{white-space:nowrap}
.sec-title h2{font-size:16px}
.sec-title .sp{flex:1}
.note{font-size:12.5px;color:var(--faint)}
.hr{height:1px;background:var(--rule)}

/* ---- Fleet grid ---- */
.fleet{display:grid;grid-template-columns:repeat(16,1fr);gap:6px}
.site{aspect-ratio:1;border:1px solid var(--rule);border-radius:var(--r-xs);background:var(--panel);position:relative;cursor:pointer;display:grid;place-items:end start;padding:5px;font-family:var(--mono);font-size:9px;color:var(--faint);transition:border-color .15s}
.site:hover{border-color:var(--ink)}
.site::before{content:"";position:absolute;top:5px;left:5px;width:6px;height:6px;border-radius:50%;background:var(--ok)}
.site.s-onb::before{background:var(--warn)}
.site.s-nyc::before{background:transparent;border:1px solid var(--faint)}
.site.s-nyc{background:transparent;border-style:dashed}
.site.is-hero{border-color:var(--signal);color:var(--signal)}
.legend{display:flex;gap:18px;font-family:var(--mono);font-size:11px;color:var(--muted);flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend i{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--ok)}
.legend i.w{background:var(--warn)}.legend i.n{background:transparent;border:1px solid var(--faint)}
.legend i.sq{border-radius:2px}

/* ---- Dark band / architecture ---- */
.band{background:var(--night);color:var(--night-text);padding:40px max(32px,env(safe-area-inset-right,0px)) 44px max(32px,env(safe-area-inset-left,0px));border-top:1px solid var(--night-rule);border-bottom:1px solid var(--night-rule)}
.band .label{color:var(--night-muted)}
.band p{color:var(--night-muted)}
.arch{display:grid;grid-template-columns:1fr 104px 1.5fr 104px 1fr;gap:0;align-items:stretch;margin-top:24px}
.node{border:1px solid var(--night-rule);background:var(--night-2);border-radius:var(--r-lg);padding:16px 18px;min-width:0}
.node h3{color:var(--night-text);font-size:14px}
.node ul{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:6px}
.node li{font-family:var(--mono);font-size:11.5px;color:var(--night-muted);display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-top:1px solid var(--night-rule)}
.node li b{color:var(--night-text);font-weight:500}
.node li.ok b{color:var(--signal-soft)}
.node--packet{background:var(--night-3);border-color:rgba(140,178,242,.35)}
.node .proto{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.node .proto span{font-family:var(--mono);font-size:10.5px;padding:3px 7px;border:1px solid var(--night-rule);border-radius:var(--r-xs);color:var(--night-muted)}
.wires{display:grid;gap:14px;align-content:center;padding:0 6px}
.wire{height:1px;background:rgba(255,255,255,.18);position:relative;overflow:visible}
.wire::after{content:"";position:absolute;top:-2px;left:0;width:5px;height:5px;border-radius:50%;background:var(--signal-soft);animation:pulse 2.2s linear infinite;animation-delay:var(--d,0s)}
.wire--back::after{animation-name:pulseBack}
.wire--back small{top:auto;bottom:-15px}
.wire small{position:absolute;top:-15px;white-space:nowrap;left:0;right:0;text-align:center;font-family:var(--mono);font-size:9.5px;color:var(--night-muted);letter-spacing:.06em;text-transform:uppercase}
@keyframes pulse{from{left:0}to{left:calc(100% - 5px)}}
@keyframes pulseBack{from{left:calc(100% - 5px)}to{left:0}}

/* ---- Runtime ---- */
.lane{display:grid;grid-template-columns:110px 1fr 90px;gap:14px;align-items:center;font-family:var(--mono);font-size:11.5px;color:var(--muted);padding:9px 0;border-bottom:1px solid var(--rule)}
.lane b{color:var(--deep);font-weight:500}
.wave{height:14px;border-radius:3px;background:repeating-linear-gradient(90deg,var(--tint) 0 2px,transparent 2px 6px);position:relative;overflow:hidden}
.wave::after{content:"";position:absolute;inset:0;width:40%;background:linear-gradient(90deg,transparent,rgba(31,95,204,.45),transparent);animation:sweep var(--t,2.4s) linear infinite}
.wave.is-paused::after{animation-play-state:paused;opacity:.4}
@keyframes sweep{from{transform:translateX(-100%)}to{transform:translateX(250%)}}
.sandbox{display:grid;grid-template-columns:1fr auto auto auto;gap:14px;align-items:center;padding:10px 12px;border:1px dashed var(--rule-strong);border-radius:var(--r-sm);font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.sandbox+.sandbox{margin-top:6px}
.sandbox b{color:var(--ink);font-weight:500}
.meter{width:70px;height:3px;border-radius:3px;background:var(--panel-2);overflow:hidden;display:inline-block;vertical-align:middle}
.meter i{display:block;height:100%;background:var(--signal);border-radius:3px;transition:width .8s var(--ease)}
.uplink{display:flex;align-items:center;justify-content:space-between;gap:10px;border-radius:var(--r-sm);padding:10px 12px;font-family:var(--mono);font-size:11.5px;background:var(--ok-tint);color:var(--ok);transition:background .3s,color .3s}
.uplink.is-down{background:var(--bad-tint);color:var(--bad)}
.uplink.is-replay{background:var(--tint);color:var(--deep)}
.uplink .dot{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block;margin-right:8px}

/* ---- Rollout ---- */
.stages{display:grid;grid-template-columns:repeat(4,1fr);padding:8px 0 4px}
.stage{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;color:var(--faint);text-align:center}
.stage+.stage::before,.stage+.stage::after{content:"";position:absolute;top:10px;right:50%;width:100%;height:1px;background:var(--rule-strong)}
.stage+.stage::after{background:var(--signal);transform:scaleX(0);transform-origin:left;transition:transform .6s var(--ease)}
.stage.is-active::after,.stage.is-done::after{transform:scaleX(1)}
.stage .sdot{position:relative;z-index:1;width:21px;height:21px;border-radius:50%;border:1.5px solid var(--rule-strong);background:var(--panel);display:grid;place-items:center;font-size:10px;color:#fff}
.stage.is-active,.stage.is-done{color:var(--ink)}
.stage.is-active .sdot{border-color:var(--signal);box-shadow:0 0 0 4px var(--tint)}
.stage.is-done .sdot{background:var(--signal);border-color:var(--signal)}
.stage.is-done .sdot::before{content:"✓"}
.stage small{color:var(--faint);font-size:10px}
.cells{display:grid;grid-template-columns:repeat(16,1fr);gap:4px}
.cell{aspect-ratio:1;border-radius:2px;background:var(--panel-2);border:1px solid var(--rule);transition:background .35s,border-color .35s}
.cell.is-dep{background:var(--tint);border-color:var(--signal-soft);animation:cellp .5s ease-in-out infinite alternate}
@keyframes cellp{to{transform:scale(.78)}}
.cell.is-ok{background:var(--signal);border-color:var(--signal)}
.cell.is-q{background:transparent;border:1px dashed var(--faint)}
.cell.is-off{background:transparent;border:1px dashed var(--bad)}
.keysq{width:8px;height:8px;border-radius:2px;display:inline-block;border:1px solid var(--rule);background:var(--panel-2)}
.keysq.ok{background:var(--signal);border-color:var(--signal)}.keysq.dep{background:var(--tint);border-color:var(--signal-soft)}.keysq.q{border:1px dashed var(--faint);background:transparent}

/* ---- Bars, sparklines, charts ---- */
.tierbar{display:flex;height:10px;border-radius:3px;overflow:hidden;background:var(--panel-2)}
.tierbar i{display:block;height:100%;transition:width .6s var(--ease)}
.tierbar .hi{background:var(--signal)}.tierbar .md{background:var(--signal-soft)}.tierbar .lo{background:var(--rule-strong)}
.conf{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:11.5px;color:var(--muted);min-width:76px}
.conf i{width:38px;height:3px;border-radius:3px;background:var(--panel-2);position:relative;overflow:hidden;display:inline-block}
.conf i::after{content:"";position:absolute;inset:0 auto 0 0;width:var(--c);background:var(--signal);border-radius:3px}
.conf.md i::after{background:var(--signal-soft)}
.conf.lo i::after{background:var(--faint)}
svg.spark{display:block;width:100%;height:36px}
svg.spark path{fill:none;stroke:var(--signal);stroke-width:1.4}
svg.spark path.ref{stroke:var(--rule-strong);stroke-dasharray:2 3}
svg.spark path.area{fill:var(--tint);stroke:none}
svg.spark path.flat{stroke:var(--warn)}
svg.spark path.bad{stroke:var(--bad)}
.chart{width:100%;height:auto;display:block}
.chart text{font-family:var(--mono);font-size:10px;fill:var(--faint)}
.chart line.grid{stroke:var(--rule);stroke-width:1}
.chart line.axis{stroke:var(--ink);stroke-width:1}
.chart rect.a{fill:var(--signal)}
.chart rect.b{fill:var(--signal-soft)}
.chart path.a{fill:none;stroke:var(--signal);stroke-width:1.6}
.chart path.b{fill:none;stroke:var(--signal-soft);stroke-width:1.6}
.chart path.g{fill:none;stroke:var(--rule-strong);stroke-width:1.2;stroke-dasharray:3 3}
.chart path.lim{fill:none;stroke:var(--bad);stroke-width:1;stroke-dasharray:4 3}
.chart path.area{fill:var(--tint);stroke:none}

/* ---- Map workspace ---- */
.ws{display:grid;grid-template-columns:minmax(0,1fr);gap:18px;align-items:start}
.side{position:fixed;right:max(20px,env(safe-area-inset-right,0px));top:72px;width:360px;max-height:calc(100vh - 96px);z-index:6;display:none}
.side.is-on{display:block}
.side .panel{max-height:calc(100vh - 96px);display:flex;flex-direction:column;box-shadow:0 1px 2px rgba(14,17,22,.05),0 24px 48px -24px rgba(14,17,22,.2)}
.side .panel__body{overflow:auto}
@media (min-width:1720px){.ws{grid-template-columns:minmax(0,1fr) 360px}.side{position:sticky;display:block;right:auto;width:auto}.side .panel{box-shadow:none}.side #side-close{display:none}}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters .sep{width:1px;height:18px;background:var(--rule-strong)}
.tagtbl{font-size:11.5px}
.tagtbl th{padding-right:6px;font-size:10px}
.tagtbl th+th,.tagtbl td+td{padding-left:6px}
.tagtbl td{padding-right:6px}
.tagtbl .conf{min-width:0;gap:5px}.tagtbl .conf i{width:26px}
.tagtbl td{padding-top:7px;padding-bottom:7px;white-space:nowrap}
.tagtbl td:nth-child(7){max-width:96px;overflow:hidden;text-overflow:ellipsis}
.tagtbl td:nth-child(3){max-width:120px;overflow:hidden;text-overflow:ellipsis}
.tagtbl code{font-size:11px;padding:2px 5px}
.tagtbl tr.is-new td{animation:rowin .45s var(--ease)}
@keyframes rowin{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.tagtbl .std{font-family:var(--mono);font-size:11px;color:var(--ink);position:relative;min-height:16px;display:block;max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tagtbl tr.is-inf .std{color:transparent}
.tagtbl tr.is-inf .std::before{content:"";position:absolute;left:0;top:50%;width:80%;height:8px;margin-top:-4px;border-radius:3px;background:linear-gradient(90deg,var(--panel-2) 0%,var(--tint) 50%,var(--panel-2) 100%);background-size:200% 100%;animation:shimmer 1.1s linear infinite}
.tagtbl tr.is-inf .conf i::after,.tagtbl tr.is-inf .tag{opacity:0}
@keyframes shimmer{from{background-position:200% 0}to{background-position:-200% 0}}
.tagtbl tr.is-gone td{opacity:0;transition:opacity .35s}
.tagtbl .cnt{font-family:var(--mono);font-size:11px;color:var(--faint)}
.sig{display:grid;grid-template-columns:120px 1fr 24px;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--rule);font-size:12.5px}
.sig .sl{color:var(--ink);font-weight:500;font-size:12.5px}
.sig .sv{color:var(--muted);font-size:12px;min-width:0}
.sig .sa{font-family:var(--mono);font-size:11px;text-align:right}
.sig .sa.y{color:var(--ok)}.sig .sa.n{color:var(--bad)}.sig .sa.m{color:var(--faint)}
.sig svg.spark{height:26px;margin-top:4px}
.nmatch{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.nmatch span{font-family:var(--mono);font-size:10px;padding:2px 5px;border-radius:3px;background:var(--panel-2);color:var(--muted)}
.nmatch span.hit{background:var(--tint);color:var(--deep)}
.scoreline{display:flex;align-items:baseline;gap:10px;padding-top:12px}
.scoreline b{font-family:var(--display);font-size:28px;font-weight:560;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.cand{border:1px solid var(--rule);border-radius:var(--r-md);padding:12px;display:grid;gap:8px;cursor:pointer}
.cand:hover{border-color:var(--ink)}
.cand.is-on{border-color:var(--ink);background:var(--panel-2)}
.cand code{white-space:normal;word-break:break-all}
.cand .ev{font-size:12px;color:var(--muted)}
.cand .ev span{display:block;padding:3px 0;border-top:1px solid var(--rule)}
.toast{position:fixed;bottom:48px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:10px 16px;border-radius:var(--r-md);font-size:13px;z-index:20;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw}
.toast.is-on{opacity:1}
.tree{font-family:var(--mono);font-size:11.5px;line-height:1.7}
.tree ul{list-style:none;margin:0;padding-left:16px;border-left:1px solid var(--rule)}
.tree>ul{padding-left:0;border-left:0}
.tree li>span{display:inline-flex;align-items:center;gap:8px;padding:1px 6px;border-radius:3px;color:var(--ink)}
.tree li>span.is-drop{background:var(--tint)}
.tree li>span .cnt{color:var(--faint);font-size:10.5px}
.tree li>span.leaf{color:var(--deep);cursor:grab;background:var(--tint);margin:2px 0}
.tree li>span.leaf.is-drag{opacity:.4}
.tree li>span.asset.is-over{outline:1px dashed var(--signal);background:var(--tint)}
.drawer{position:fixed;top:0;right:0;bottom:0;width:420px;max-width:100vw;background:var(--panel);border-left:1px solid var(--rule);z-index:15;transform:translateX(100%);transition:transform .3s var(--ease);display:flex;flex-direction:column}
.drawer.is-open{transform:none}
.drawer .panel__body{overflow:auto;flex:1}
.audit{border-top:1px solid var(--ink)}
.audit>div{padding:10px 0;border-bottom:1px solid var(--rule);display:grid;grid-template-columns:70px 1fr;gap:10px;font-size:12.5px}
.audit .who{font-family:var(--mono);font-size:11px;color:var(--faint)}
.audit b{font-weight:500}
.audit small{display:block;color:var(--muted);font-size:12px}
.scrim{position:fixed;inset:0;background:rgba(14,17,22,.18);z-index:14;opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.is-on{opacity:1;pointer-events:auto}

/* ---- Data quality cards ---- */
.dq{border-top:1px solid var(--ink)}
.dq>div{border-bottom:1px solid var(--rule)}
.dq .dqh{display:grid;grid-template-columns:150px 70px 1fr auto;gap:16px;align-items:center;padding:12px 0;cursor:pointer}
.dq .dqh:hover .dqt{color:var(--signal)}
.dq .dqh b{font-family:var(--display);font-size:22px;font-weight:560;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.dq .dqb{display:none;padding:0 0 16px}
.dq>div.is-open .dqb{display:block}
.dq .dqrow{display:grid;grid-template-columns:260px 1fr 140px;gap:16px;align-items:center;padding:8px 0;border-top:1px solid var(--rule);font-size:12.5px}
.dq .dqrow:first-child{border-top:1px solid var(--rule-strong)}

/* ---- Diff ---- */
.diff{font-family:var(--mono);font-size:11.5px;border-top:1px solid var(--ink);line-height:1.6}
.diff div{padding:3px 8px;border-bottom:1px solid var(--rule);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.diff .add{background:var(--ok-tint);color:var(--ok)}
.diff .del{background:var(--bad-tint);color:var(--bad)}
.diff .ctx{color:var(--muted)}
.codeblock{font-family:var(--mono);font-size:12px;background:var(--panel-2);border-radius:var(--r-md);padding:14px 16px;white-space:pre;overflow-x:auto;line-height:1.6;color:var(--ink)}
.codeblock .k{color:var(--deep)}
.codeblock .c{color:var(--faint)}

/* ---- Timeline ---- */
.timeline{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--ink)}
.timeline>div{padding:14px 16px 16px 0;border-bottom:1px solid var(--rule)}
.timeline>div+div{border-left:1px solid var(--rule);padding-left:16px}
.timeline h3{margin-top:6px}
.timeline p{font-size:13px;margin-top:6px}
.outcome{display:flex;align-items:baseline;gap:18px;flex-wrap:wrap}
.outcome b{font-family:var(--display);font-size:56px;font-weight:560;letter-spacing:-.04em;line-height:1}
.outcome b em{font-style:normal;color:var(--faint)}
.pend{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--r-sm);background:var(--warn-tint);color:var(--warn);font-family:var(--mono);font-size:11.5px}
.sched{display:grid;grid-template-columns:70px 1fr 1fr;font-family:var(--mono);font-size:11.5px;border-top:1px solid var(--ink)}
.sched>div{padding:7px 0;border-bottom:1px solid var(--rule);color:var(--muted)}
.sched>div.h{color:var(--faint);text-transform:uppercase;letter-spacing:.08em;font-size:10.5px}
.sched>div.p{color:var(--deep)}

/* ---- Hybrid additions ---- */
.panel__head{background:var(--panel-2);border-radius:var(--r-lg) var(--r-lg) 0 0}
.steps{display:flex;align-items:center;gap:0;border-bottom:1px solid var(--rule);padding:0 0 14px;overflow-x:auto}
.step{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--faint);white-space:nowrap;position:relative;padding-right:28px;margin-right:12px;cursor:pointer}
.step::after{content:"";position:absolute;right:0;top:50%;width:20px;height:1px;background:var(--rule-strong)}
.step:last-child::after{display:none}
.step:last-child{padding-right:0;margin-right:0}
.step i{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--rule-strong);display:grid;place-items:center;font-size:10px;font-style:normal;color:var(--panel);flex:none}
.step.is-done{color:var(--muted)}
.step.is-done i{background:var(--ok);border-color:var(--ok)}
.step.is-done i::before{content:"✓"}
.step.is-cur{color:var(--signal);font-weight:500}
.step.is-cur i{border-color:var(--signal);box-shadow:0 0 0 3px var(--tint)}
.step.is-cur i::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--signal)}
.step small{font-family:var(--mono);font-size:10.5px;color:var(--faint);font-weight:400}
.step.is-cur small{color:var(--signal)}
.cov{display:grid;gap:0}
.covrow{display:grid;grid-template-columns:1fr auto;gap:6px 16px;padding:10px 0;border-bottom:1px solid var(--rule);align-items:center}
.covrow .cvh{display:flex;align-items:baseline;gap:10px;font-size:13px}
.covrow .cvh b{font-weight:500}
.covrow .cvh .mono{font-size:11px;color:var(--faint)}
.covrow .cvn{font-family:var(--mono);font-size:12px;text-align:right;font-variant-numeric:tabular-nums}
.covrow .cvn b{font-weight:500;color:var(--signal)}
.covbar{grid-column:1 / -1;height:6px;border-radius:3px;background:var(--panel-2);overflow:hidden;display:flex}
.covbar i{display:block;height:100%;background:var(--signal);transition:width .6s var(--ease)}
.covbar i.w{background:var(--warn)}
.covrow .cvs{grid-column:1 / -1;font-size:11.5px;color:var(--muted)}
.cta{background:var(--tint);border:1px solid var(--signal-soft);border-radius:var(--r-lg);padding:18px 20px;display:grid;gap:12px;min-width:0}
.cta .big{font-family:var(--display);font-size:44px;font-weight:560;letter-spacing:-.04em;line-height:1;color:var(--deep);font-variant-numeric:tabular-nums}
.cta .big small{font-family:var(--body);font-size:13px;font-weight:400;color:var(--muted);letter-spacing:0;margin-left:8px}
.cta .tbar{display:grid;grid-template-columns:70px 1fr auto;gap:10px;align-items:center;font-family:var(--mono);font-size:11px;color:var(--muted)}
.cta .tbar .b{height:5px;border-radius:3px;background:rgba(31,95,204,.12);overflow:hidden}.cta .tbar .b i{display:block;height:100%;background:var(--signal)}.cta .tbar .b i.w{background:var(--warn)}.cta .tbar .b i.f{background:var(--faint)}
.btn--signal{background:var(--signal);border-color:var(--signal);color:#fff;justify-content:center;padding:11px 16px;font-size:14px}
.btn--signal:hover{background:var(--signal-hover)}
.btn--signal[disabled]{background:var(--signal-soft);border-color:var(--signal-soft);opacity:1}
/* wiring */
.wiring{position:relative;min-height:400px;background:var(--panel);border:1px solid var(--rule);border-radius:var(--r-lg);overflow:hidden;background-image:radial-gradient(var(--rule) .6px,transparent .6px);background-size:16px 16px}
.wiring svg{position:absolute;inset:0;width:100%;height:100%}
.wiring svg path{fill:none;stroke-width:1.4}
.wiring svg path.hi{stroke:var(--signal)}.wiring svg path.md{stroke:var(--warn)}.wiring svg path.lo{stroke:var(--faint);stroke-dasharray:4 3}.wiring svg path.src{stroke:var(--rule-strong)}
.wiring svg path.is-sel{stroke-width:2.4}
.wiring svg path.flow{stroke-dasharray:3 9;animation:wflow 1.6s linear infinite}
@keyframes wflow{to{stroke-dashoffset:-12}}
.wiring .colh{position:absolute;top:12px;font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--faint);border-bottom:1px solid var(--rule);padding-bottom:6px}
.wsrc{position:absolute;width:170px;border-left:3px solid var(--ink);background:var(--panel);padding:7px 10px;border-radius:0 var(--r-sm) var(--r-sm) 0;box-shadow:0 0 0 1px var(--rule)}
.wsrc b{display:block;font-weight:500;font-size:12.5px}
.wsrc span{font-family:var(--mono);font-size:10px;color:var(--faint)}
.wpill{position:absolute;width:176px;height:30px;border:1px solid var(--rule-strong);border-radius:15px;background:var(--panel);display:flex;align-items:center;gap:8px;padding:0 10px;font-family:var(--mono);font-size:11px;color:var(--ink);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:border-color .15s}
.wpill:hover{border-color:var(--ink)}
.wpill i{width:7px;height:7px;border-radius:50%;background:var(--signal);flex:none}
.wpill.md{border-color:var(--warn)}.wpill.md i{background:var(--warn)}
.wpill.lo{border-style:dashed;border-color:var(--faint)}.wpill.lo i{background:var(--faint)}
.wpill.is-sel{background:var(--tint);border-color:var(--signal);box-shadow:0 0 0 2px var(--tint)}
.wcan{position:absolute;width:230px;display:grid;gap:1px;padding-left:14px;line-height:1.2}
.wcan::before{content:"";position:absolute;left:0;top:9px;width:9px;height:9px;border-radius:50%;background:var(--signal);border:2px solid var(--panel);box-shadow:0 0 0 1px var(--signal)}
.wcan.md::before{background:var(--warn);box-shadow:0 0 0 1px var(--warn)}
.wcan.lo::before{background:var(--panel);box-shadow:0 0 0 1px var(--faint)}
.wcan b{font-weight:500;font-size:12px;font-family:var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wcan span{font-family:var(--mono);font-size:10px;color:var(--faint)}
.wcan .wa{font-family:var(--mono);font-size:10px;color:var(--signal);text-transform:none}
/* inspector */
.insp{display:grid;gap:14px}
.insp .label{display:block;margin-bottom:6px}
.crumbtree{font-size:12.5px;display:grid;gap:2px}
.crumbtree div{display:flex;align-items:center;gap:8px}
.crumbtree div::before{content:"";width:12px;height:12px;border:1px solid var(--rule-strong);border-radius:3px;flex:none}
.crumbtree div.is-leaf::before{background:var(--signal);border-color:var(--signal)}
.crumbtree div span{font-family:var(--mono);font-size:11.5px}
.boxes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.boxes>div{border:1px solid var(--rule);border-radius:var(--r-md);padding:8px 10px}
.boxes>div.full{grid-column:1 / -1}
.boxes b{display:block;font-weight:500;font-size:13px;margin-top:2px}
.boxes .label{margin-bottom:0;font-size:10px}
.lineage{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;align-items:start;font-family:var(--mono);font-size:10px;color:var(--muted);text-align:center;position:relative}
.lineage::before{content:"";position:absolute;left:12%;right:12%;top:9px;height:1px;background:var(--rule-strong)}
.lineage>div{display:grid;gap:4px;justify-items:center;position:relative}
.lineage i{width:18px;height:18px;border-radius:50%;border:1px solid var(--signal);background:var(--panel);display:grid;place-items:center;font-size:9px;font-style:normal;color:var(--signal)}
.lineage b{font-weight:500;color:var(--ink);font-size:10.5px;word-break:break-all}
.livebig{display:flex;align-items:baseline;gap:8px}
.livebig b{font-family:var(--display);font-size:30px;font-weight:560;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.livebig span{color:var(--muted);font-size:13px}
.livebig .ld{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--ok)}
.corr{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.corr select{padding:3px 6px;font-size:11.5px;font-family:var(--mono)}
/* fleet map */
.fmap{position:relative;height:420px;background:var(--panel);border:1px solid var(--rule);border-radius:var(--r-lg);overflow:hidden;background-image:linear-gradient(var(--rule) 1px,transparent 1px),linear-gradient(90deg,var(--rule) 1px,transparent 1px);background-size:40px 40px;background-position:-1px -1px}
.fmap svg{position:absolute;inset:0;width:100%;height:100%}
.fmap svg line{stroke:var(--rule-strong);stroke-width:1}
.fmap svg line.off{stroke:var(--faint);stroke-dasharray:3 3}
.fmap .hub{position:absolute;width:14px;height:14px;border-radius:50%;background:var(--ink);transform:translate(-50%,-50%)}
.fmap .hub span{position:absolute;top:16px;left:50%;transform:translateX(-50%);font-family:var(--mono);font-size:10px;color:var(--muted);white-space:nowrap}
.fmap .mk{position:absolute;width:14px;height:14px;border-radius:50%;background:var(--panel-2);border:1px solid var(--rule-strong);transform:translate(-50%,-50%);transition:background .35s,border-color .35s;cursor:pointer}
.fmap .mk.is-dep{background:var(--tint);border-color:var(--signal);animation:cellp .5s ease-in-out infinite alternate}
.fmap .mk.is-ok{background:var(--signal);border-color:var(--signal)}
.fmap .mk.is-q{background:transparent;border:1px dashed var(--faint)}
.fmap .mk.is-hero{width:22px;height:22px;border-width:1.5px}
.fmap .mk em{position:absolute;top:16px;left:50%;transform:translateX(-50%);font-style:normal;font-family:var(--mono);font-size:9.5px;color:var(--muted);white-space:nowrap}
.fmap .mk.is-hero em{top:24px;color:var(--ink)}
.fmap .mk b{position:absolute;top:-14px;left:50%;transform:translateX(-50%);font-family:var(--mono);font-size:8.5px;font-weight:500;padding:0 4px;border-radius:3px;background:var(--tint);color:var(--deep);white-space:nowrap;opacity:0;transition:opacity .3s}
.fmap .mk.is-ok b{opacity:1}
.waves{display:grid;gap:8px}
.wv{border:1px solid var(--rule);border-radius:var(--r-md);padding:10px 12px;display:grid;gap:5px}
.wv .wh{display:flex;align-items:center;gap:8px;font-size:13px}
.wv .wh b{font-weight:500}
.wv .wh .sp{flex:1}
.wv .wg{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.wv.is-cur{border-color:var(--signal);background:var(--tint)}
.wv.is-q{color:var(--faint)}
.wv .pb{height:4px;border-radius:2px;background:var(--panel-2);overflow:hidden}.wv .pb i{display:block;height:100%;background:var(--signal);transition:width .6s var(--ease)}
.tl{display:grid;gap:0}
.tl>div{display:grid;grid-template-columns:48px 1fr;gap:10px;padding:7px 0;font-size:12.5px;position:relative;padding-left:16px}
.tl>div::before{content:"";position:absolute;left:3px;top:13px;width:7px;height:7px;border-radius:50%;background:var(--signal)}
.tl>div::after{content:"";position:absolute;left:6px;top:22px;bottom:-8px;width:1px;background:var(--rule)}
.tl>div:last-child::after{display:none}
.tl>div.is-pend::before{background:var(--panel);border:1px solid var(--faint)}
.tl .t{font-family:var(--mono);font-size:11px;color:var(--faint)}
.apr{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--ok-tint);border-radius:var(--r-sm);font-size:12.5px;color:var(--ok)}
.apr .sp{flex:1}.apr .mono{font-size:11px}
.view-toggle{display:flex;gap:12px;align-items:center;flex-wrap:wrap}

/* ---- Responsive ---- */
@media (max-width:1100px){.cols-3{grid-template-columns:1fr 1fr}.side{position:static;width:auto;display:block}.strip,.timeline{grid-template-columns:1fr 1fr}.fleet{grid-template-columns:repeat(8,1fr)}.cells{grid-template-columns:repeat(8,1fr)}.arch{grid-template-columns:1fr}.wires{grid-template-columns:1fr;padding:20px 0}}

// sparkline: values[] -> svg path; opts: ref (second series), cls
function spark(vals, opts={}){
  const w=opts.w||120, h=opts.h||36, pad=2;
  const all = opts.ref ? vals.concat(opts.ref) : vals;
  let lo=Math.min(...all), hi=Math.max(...all); if (hi===lo){hi=lo+1;lo=lo-1;}
  const pt = (v,i,n)=>[pad+i*(w-2*pad)/(n-1), h-pad-(v-lo)/(hi-lo)*(h-2*pad)];
  const path = arr => arr.map((v,i)=>{const [x,y]=pt(v,i,arr.length);return (i?'L':'M')+x.toFixed(1)+' '+y.toFixed(1);}).join(' ');
  const area = opts.area ? `<path class="area" d="${path(vals)} L${(w-pad).toFixed(1)} ${h-pad} L${pad} ${h-pad} Z"></path>` : '';
  const ref = opts.ref ? `<path class="ref" d="${path(opts.ref)}"></path>` : '';
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true">${area}${ref}<path class="${opts.cls||''}" d="${path(vals)}"></path></svg>`;
}

const cycle = (n=48, amp=1) => Array.from({length:n},(_,i)=>+(amp*Math.sin(i/(n-1)*Math.PI*2)).toFixed(3));

/* ---------- Map and contextualize ---------- */
const GROUPS = {all:'All', PV:'PV', BESS:'BESS', POI:'POI & PPC', Met:'Met', Trackers:'Trackers'};
function mapCounts(){ const c={total:D.tags.length,auto:0,accepted:0,review:0,ignored:0}; D.tags.forEach(t=>c[t.status==='corrected'?'accepted':t.status]++); return c; }
function filtered(){
  const f=A.map.filters, q=f.q.toLowerCase();
  return D.tags.filter(t=> (f.group==='all'||t.group===f.group||(f.group==='POI'&&t.group==='POI')) && (f.tier==='all'||t.tier===f.tier) && (f.status==='all'||t.status===f.status||(f.status==='accepted'&&t.status==='corrected')) && (f.proto==='all'||t.proto.startsWith(f.proto)) && (!q||t.raw.toLowerCase().includes(q)||t.std.toLowerCase().includes(q)||t.dev.toLowerCase().includes(q)));
}
function signalsFor(t){
  const isPow=/power/.test(t.std), isV=/voltage/.test(t.std), isI=/current/.test(t.std), isInv=D.devMap[t.dev].role==='Inverter', isBess=t.group==='BESS', isIrr=/irradiance|ghi|poa/.test(t.std);
  const sunspec = D.devMap[t.dev].sunspec;
  const y='y',n='n',m='m';
  const conv = t.std ? (t.raw.replace(/[^a-z]/gi,'').toLowerCase().length>3 && /[a-z]/i.test(t.raw) ? y : m) : n;
  const s = [];
  s.push({ l:'Naming convention', a: t.curated&&t.ambiguous?n:conv, v: conv===y?`<code>${esc(t.raw)}</code> matches the ${D.devMap[t.dev].vendor.split(',')[0]} pattern for ${t.qty.toLowerCase()}` : conv===m?`Bare register or opaque name. No vocabulary match.`:'No usable name' });
  s.push({ l:'Value range', a: t.live==null?n:(t.ambiguous?m:y), v: t.live==null?'No live value (device not responding)':`Reads <span class="live">${fmt(t.live)}${t.unit?' '+t.unit:''}</span>, inside the expected range for ${t.qty.toLowerCase()}` });
  const beh = isPow&&!isBess||isIrr||isI ? {a:y, v:'Follows irradiance over the day', sp: spark(bell(48,1,0.08),{ref:bell(48,1,0),area:true})} : isBess&&(isPow||/soc/.test(t.std)) ? {a: t.frozen?n:y, v: t.frozen?'Flat while the container cycles':'Tracks the charge and discharge cycle', sp: spark(t.frozen?Array(48).fill(0.5):cycle(48,1).map(v=>v*0.5+0.5),{ref:cycle(48,1).map((v,i)=>0.5-v*0.4),cls:t.frozen?'flat':''})} : {a:m, v:'Slow-moving or discrete; behaviour not decisive', sp: spark(Array.from({length:48},(_,i)=>0.5+Math.sin(i/6)*0.05+(D.rnd()-0.5)*0.03))};
  s.push({ l:'Behaviour over time', a:beh.a, v:beh.v, sp:beh.sp });
  const phys = isPow&&isInv ? {a:y, v:'kW ≈ V × A × √3 × PF within 1.8 %; sum of inverter AC power ≈ POI meter minus losses'} : isPow&&isBess ? {a:y, v:'Power sign flips when the SOC slope changes; PCS sum ≈ BESS plant power'} : isV ? {a:y, v:'V × A × √3 × PF ≈ kW on the same device'} : /soc/.test(t.std) ? {a:t.frozen?n:y, v:t.frozen?'SOC does not move while rack current flows':'SOC slope matches integrated rack current'} : t.ambiguous ? {a:m, v:'Magnitude fits a 5 MVA auxiliary; sign pattern fits either candidate'} : {a:m, v:'No physical cross-check applies'};
  s.push({ l:'Physical cross-checks', a:phys.a, v:phys.v });
  s.push({ l:'SunSpec model', a: sunspec?(t.curated&&/^\d+$/.test(t.raw)?y:y):m, v: sunspec?`Device self-identifies; register ${esc(t.addr)} maps to SunSpec ${isPow?'model 103 W':isV?'model 103 PhVphAB':isI?'model 103 AphA':'model 103'}`:'Device does not publish a SunSpec model' });
  const nb = t.std ? (t.ambiguous? m : y) : n;
  s.push({ l:'Neighbouring tags', a:nb, v: nb===y?'Adjacent registers decode as the same quantity family':'Neighbours are a mix of quantities', nm: true });
  const xs = t.tier==='high' ? y : t.tier==='medium' ? m : n;
  s.push({ l:'Match at another site', a:xs, v: xs===y?`Validated against the same vendor at ${t.group==='PV'?'Baker Flats Solar':t.group==='BESS'?'Pine Hollow BESS':'North Ridge'}`:xs===m?'Partial match at North Ridge (different firmware)':'No validated match' });
  return s;
}
function renderReason(t){
  const el=$('#reason'); if(!el) return;

  const sig=signalsFor(t);
  el.innerHTML = `
    <div style="display:grid;gap:4px;margin-bottom:8px"><code style="font-size:12px;align-self:start;justify-self:start">${esc(t.raw)}</code><span class="mono" style="font-size:11px;color:var(--muted)">${esc(t.dev)} · ${esc(t.proto)} · ${esc(t.addr)}</span></div>

    <div style="border-top:1px solid var(--ink)">${sig.map(s=>`<div class="sig"><span class="sl">${s.l}</span><div class="sv">${s.v}${s.sp||''}${s.nm?`<div class="nmatch">${['−2','−1','this','+1','+2'].map((k,i)=>`<span class="${s.a==='y'||i===2?'hit':''}">${k}</span>`).join('')}</div>`:''}</div><span class="sa ${s.a}">${s.a==='y'?'agrees':s.a==='n'?'disagrees':'neutral'}</span></div>`).join('')}</div>

function mapAction(act,t){

const STEPS = [['connect','Connect','Day 1'],['discovery','Discover','Day 2'],['map','Map','Day 3'],['dq','Quality','Day 4'],['model','Model','Day 4'],['drift','Drift','later'],['app2','Application','Day 5'],['pilot','Readout','Day 5']];
const baseGo = go;
go = function(id){
  baseGo(id);
  if (META[id].act!=='In pilot') return;

  const el = document.createElement('div'); el.className='steps';
  el.innerHTML = STEPS.map((s,i)=>`<div class="step ${i<cur?'is-done':i===cur?'is-cur':''}" data-go="${s[0]}"><i></i><span>${s[1]}</span><small>${s[2]}</small></div>`).join('');

};

/* ---- Inspector (replaces the reasoning card) ---- */
renderReason = function(t){
  const el=$('#reason'); if(!el) return;
  if (!t){ el.innerHTML='<p class="note">Click a raw tag in the wiring view or a row in the table to inspect it.</p>'; return; }
  const sig=signalsFor(t);
  const parts = t.std ? t.std.split('.') : [];
  const crumbs = parts.length ? parts.map((p,i)=>`<div class="${i===parts.length-1?'is-leaf':''}" style="padding-left:${i*14}px"><span>${esc(p)}</span></div>`).join('') : '<div><span style="color:var(--faint)">no canonical object yet</span></div>';
  const role = /setpoint/.test(t.std)?'Setpoint readback':/state|mode|alarm|fault|code|word|bool/.test(t.std+t.unit)?'State':/energy/.test(t.std)?'Counter':'Measurement';
  const cls = D.devMap[t.dev].role + ' · ' + D.devMap[t.dev].vendor.split(',')[0];
  const who = t.status==='auto'?'auto-accepted':t.status==='accepted'||t.status==='corrected'?'m.tremblay':'pending';
  const series = /power|irradiance|ghi|poa|current/.test(t.std)&&t.group!=='BESS' ? bell(40,1,0.06).map(v=>v*(t.live||1)) : t.group==='BESS' ? cycle(40,1).map(v=>(t.live||1)*(1+v*0.08)) : Array.from({length:40},(_,i)=>(t.live||1)*(1+Math.sin(i/5)*0.004));
  el.innerHTML = `<div class="insp">
    <div><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><code style="font-size:12px">${esc(t.raw)}</code>${tierTag(t.tier)}${statusTag(t.status)}</div><div class="mono" style="font-size:11px;color:var(--muted);margin-top:6px">${esc(t.dev)} · ${esc(t.proto)} · ${esc(t.addr)}</div></div>
    <div><span class="label">Canonical object</span><div class="crumbtree">${crumbs}</div></div>
    <div class="boxes"><div><span class="label">Unit</span><b>${esc(t.unit)||'—'}${t.scale?` <span class="note">· scale ${esc(t.scale)}</span>`:''}</b></div><div><span class="label">Role</span><b>${role}</b></div><div class="full"><span class="label">Class</span><b>${esc(cls)}</b></div></div>
    <div><span class="label">Why this proposal</span><div style="border-top:1px solid var(--ink)">${sig.map(s=>`<div class="sig"><span class="sl">${s.l}</span><div class="sv">${s.v}${s.sp||''}${s.nm?`<div class="nmatch">${['−2','−1','this','+1','+2'].map((k,i)=>`<span class="${s.a==='y'||i===2?'hit':''}">${k}</span>`).join('')}</div>`:''}</div><span class="sa ${s.a}">${s.a==='y'?'agrees':s.a==='n'?'disagrees':'neutral'}</span></div>`).join('')}</div>
      <div class="scoreline"><b>${t.conf.toFixed(2)}</b><span class="note">${sig.filter(s=>s.a==='y').length} of 7 signals agree · ${t.tier} tier</span></div></div>
    <div><span class="label">Lineage</span><div class="lineage"><div><i>R</i><b>${esc(t.raw)}</b><span>raw</span></div><div><i>D</i><b>${esc(t.dev)}</b><span>${esc(t.proto.split(' ')[0])}</span></div><div><i>${who==='pending'?'?':'✓'}</i><b>${who}</b><span>${who==='pending'?'in review':'accepted'}</span></div><div><i>M</i><b>v1.1</b><span>model</span></div></div></div>
    <div><div style="display:flex;justify-content:space-between;align-items:baseline"><span class="label">Live value</span><span class="note">last 60 min</span></div>${spark(series,{area:true,h:44})}<div class="livebig"><b>${t.live==null?'—':fmt(t.live)}</b><span>${esc(t.unit)}</span><span class="ld">${t.live==null?'':'● live'}</span></div></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      ${t.status==='review'?`<button class="btn btn--sm btn--primary" data-act="accept">Accept</button><button class="btn btn--sm" data-act="correct">Correct</button><button class="btn btn--sm" data-act="ignore">Ignore</button>`:`<button class="btn btn--sm" data-act="correct">Correct</button>`}

      ${t.ambiguous?`<button class="btn btn--sm" data-act="amb">Resolve candidates</button>`:''}
    </div>
    <div id="corr-inline" hidden></div>
  </div>`;
  $$('[data-act]',el).forEach(b=>b.addEventListener('click',()=>{ if (b.dataset.act==='correct') return inlineCorrect(t, $('#corr-inline')); mapAction(b.dataset.act,t); }));

    <div class="tblwrap"><table class="tbl"><thead><tr><th>Node</th><th>Site</th><th>Canonical input</th><th>Local raw tag</th><th>Vendor</th><th>Status</th></tr></thead><tbody>
      <tr><td><code>cr-gw-01</code></td><td>Chisholm Ridge</td><td class="mono" style="font-size:11.5px">inverter.ac_power_kw</td><td><code>INV3_ACPWR</code></td><td style="color:var(--muted)">Vendor A, fw 3.2</td><td><span class="tag tag--ok">bound</span></td></tr>
      <tr><td><code>nr-gw-01</code></td><td>North Ridge</td><td class="mono" style="font-size:11.5px;color:var(--muted)">↑ same canonical</td><td><code>NR.PV.B02.INV05.P_AC</code></td><td style="color:var(--muted)">Vendor F, fw 2.4</td><td><span class="tag tag--ok">bound</span></td></tr>
      <tr><td><code>bf-gw-01</code></td><td>Baker Flats Solar</td><td class="mono" style="font-size:11.5px;color:var(--muted)">↑ same canonical</td><td><code>Inv_05_W</code></td><td style="color:var(--muted)">Vendor A, fw 3.1</td><td><span class="tag tag--ok">bound</span></td></tr>
      <tr><td><code>cd-gw-01</code></td><td>Cedar Draw Solar</td><td class="mono" style="font-size:11.5px;color:var(--muted)">↑ same canonical</td><td><code>CD_INV05_kW</code></td><td style="color:var(--muted)">Vendor J, fw 5.0</td><td><span class="tag tag--warn">pending · onboarding</span></td></tr>
    </tbody></table></div>
    <p class="note" style="margin-top:10px">Same canonical input resolves to four different raw tags. The application has no site-specific code.</p></div></div>`;
  $('.cols',el).insertAdjacentElement('afterend', block.firstElementChild);
};

/* ---- Fleet orchestration: map, waves, change record ---- */
SCREENS.orch = el => {
  const waves=[{n:'Build',c:0,gate:'image signed · SBOM attached'},{n:'Canary',c:2,gate:'error rate < 0.5 % · ingest continuity · 30 min soak'},{n:'Wave 1',c:14,gate:'error rate < 0.5 % · ingest continuity · p95 latency unchanged'},{n:'Fleet',c:48,gate:'error rate < 0.5 % · heartbeat every 5 min'}];
  const OFF=3;
  const order=D.sites.map((_,i)=>i).sort((a,b)=>(a*7919%64)-(b*7919%64));
  const waveOf={}; let k=0; waves.forEach((w,i)=>{ for(let j=0;j<w.c;j++) waveOf[order[k++]]=i; });
  // deterministic positions
  const pos=D.sites.map((s,i)=>{ const a=(i*137.508)%360*Math.PI/180; const r=0.18+((i*31)%47)/47*0.3; return [50+Math.cos(a)*r*100*1.15, 50+Math.sin(a)*r*100]; });
  pos[0]=[64,62]; pos[1]=[36,34]; pos[3]=[22,70];
  el.innerHTML = `
    ${titlebar('Fleet orchestration','Deployment campaign <code>alarm.correlator v2.1.0</code> to 64 sites, in stages with health gates. What is running where, and is it what we intended.', `<button class="btn" id="pause">Pause rollout</button><button class="btn btn--primary" id="advance">Advance wave</button>`)}
    <div class="cols cols-12">
      <div class="span-8"><div class="fmap" id="fmap"><svg>${pos.map((p,i)=>`<line class="${i===OFF?'off':''}" x1="50%" y1="50%" x2="${p[0]}%" y2="${p[1]}%"></line>`).join('')}</svg><div class="hub" style="left:50%;top:50%"><span>control plane</span></div>${pos.map((p,i)=>`<div class="mk ${i===0||i===1||i===OFF?'is-hero':''}" data-i="${i}" title="${esc(D.sites[i].name)}" style="left:${p[0]}%;top:${p[1]}%"><b>v2.1.0</b>${i===0||i===1||i===OFF?`<em>${esc(D.sites[i].name.replace(' Solar + Storage',''))}</em>`:''}</div>`).join('')}</div>
        <div class="legend" style="margin-top:10px"><span><span class="keysq ok"></span>Healthy on v2.1.0</span><span><span class="keysq dep"></span>Deploying</span><span><span class="keysq q"></span>Queued · node offline</span><span><span class="keysq"></span>On v2.0.3</span><span class="sp"></span><span id="health" class="mono" style="font-size:11px"></span></div></div>
      <div class="span-4"><div class="panel"><div class="panel__head"><b>Rollout</b><span class="sp"></span><span class="mono" style="font-size:11px;color:var(--faint)">alarm.correlator v2.1.0</span></div><div class="panel__body"><div class="waves" id="waves"></div>
        <div style="display:flex;gap:8px;margin-top:12px"><button class="btn btn--sm" id="rollback">Roll back to v2.0.3</button><span class="switch is-on" style="margin-left:auto;font-size:12px"><i></i>Auto-rollback armed</span></div><div id="rb-msg" class="note" style="margin-top:8px"></div></div></div></div>
    </div>
    <div class="cols cols-2">
      <div class="panel"><div class="panel__head"><b>Change record</b><code>CR-2041</code><span class="sp"></span><span class="mono" style="font-size:11px;color:var(--faint)">author j.okafor · requested 08:40</span></div><div class="panel__body" style="display:grid;gap:10px">
        <span class="label">Approvals · 2 of 2 required</span>
        <div class="apr">✓ <b style="font-weight:500">O&amp;M lead</b> s.ahmed<span class="sp"></span><span class="mono">09:02</span></div>
        <div class="apr">✓ <b style="font-weight:500">OT security</b> r.lund<span class="sp"></span><span class="mono">09:15</span></div>
        <span class="label" style="margin-top:6px">Diff · 3 objects changed · <span style="color:var(--ok)">+12</span> <span style="color:var(--bad)">−3</span></span>
        <div class="diff"><div class="add">+ applications/alarm.correlator/rules/inverter_derate_chain.yaml   (8 rules)</div><div class="ctx">~ applications/alarm.correlator/rules/poi_breaker_storm.yaml       (+4 −3)</div><div class="ctx">~ applications/alarm.correlator/version.json                       v2.0.3 → v2.1.0</div></div>
        <div class="kv"><span class="label">Target</span><span class="kvv">model classes inverter, poi · 64 sites</span><span class="label">Rollback</span><span class="kvv">automatic if a gate fails; manual at any time</span></div>
      </div></div>
      <div class="panel"><div class="panel__head"><b>Audit</b><span class="sp"></span><span class="label">changes today</span></div><div class="panel__body"><div class="tl" id="orch-tl"></div></div></div>
    </div>
    <div>
      ${secTitle('Node registry','Identity, connectivity, versions')}
      <div class="tblwrap"><table class="tbl"><thead><tr><th>Node</th><th>Site</th><th>Type</th><th>Connectivity</th><th>Config</th><th>Software</th><th>Model</th><th>Certificate</th></tr></thead><tbody>
        ${D.registry.map(r=>`<tr><td><code>${r.node}</code></td><td>${r.site}</td><td style="color:var(--muted)">${r.type}</td><td>${r.conn==='online'?'<span class="tag tag--ok">online</span>':'<span class="tag tag--bad">offline</span>'} <span class="mono" style="font-size:11px;color:var(--faint)">${r.lastSeen}</span></td><td class="mono">${r.cfg}</td><td class="mono">${r.sw}</td><td class="mono">${r.model}</td><td class="mono" style="color:${r.cert.startsWith('exp in 3')?'var(--warn)':'var(--muted)'}">${r.cert}</td></tr>`).join('')}
        <tr><td colspan="8" class="note">54 more nodes</td></tr>
      </tbody></table></div>
    </div>`;
  const mks=$$('.mk',el);
  const paint=()=>{
    mks.forEach((m,i)=>{ const w=waveOf[i]; let cls='mk'; if (w!==undefined){ if (i===OFF && A.wave>=w) cls+=' is-q'; else if (w<A.wave) cls+=' is-ok'; else if (w===A.wave) cls+=' is-dep'; } if (i===0||i===1||i===OFF) cls+=' is-hero'; m.className=cls; });
    const msgs=['build signed · waiting for canary','canary 2/2 healthy · error rate 0.0 %','wave 1 14/14 healthy · p95 latency unchanged','fleet 47/48 healthy · 1 queued (kc-gw-01 offline)','complete · 63 on v2.1.0 · kc-gw-01 will converge on reconnect'];
    $('#health').textContent=msgs[A.wave]; $('#health').style.color=A.wave>=1?'var(--ok)':'var(--faint)';
    $('#waves').innerHTML = waves.map((w,i)=>{ const st = i<A.wave?'done':i===A.wave&&A.wave<4?'cur':'q'; return `<div class="wv ${st==='cur'?'is-cur':st==='q'?'is-q':''}"><div class="wh"><span>${st==='done'?'✓':st==='cur'?'●':'○'}</span><b>${w.n}</b><span class="note">${w.c?w.c+' sites':'image'}</span><span class="sp"></span><span class="tag ${st==='done'?'tag--ok':st==='cur'?'tag--pilot':''}">${st==='done'?'passed':st==='cur'?(A.paused?'paused':'in progress'):'queued'}</span></div><div class="wg">${w.gate}</div>${st==='cur'&&w.c?`<div class="pb"><i style="width:${A.paused?40:70}%"></i></div>`:''}${i===3&&A.wave>=3&&A.wave<5?'<div class="wg" style="color:var(--warn)">kc-gw-01 offline · applies on reconnect</div>':''}</div>`; }).join('');
    const tl=[['08:40','CR-2041 created by j.okafor'],['09:02','Approved · s.ahmed (O&M lead)'],['09:15','Approved · r.lund (OT security) · 2 of 2'],['09:20','Build signed'],['09:31','Canary started · 2 nodes'],['10:02','Canary passed · gates green'],['10:05','Wave 1 started · 14 nodes'],['10:48','Wave 1 passed'],['10:50','Fleet wave started · 48 nodes'],['11:40','kc-gw-01 queued · offline, awaiting reconnect'],['12:06','Campaign complete · 63 on v2.1.0']];
    const n=[4,6,8,10,11][A.wave];
    $('#orch-tl').innerHTML = tl.slice(0,n).map(x=>`<div><span class="t">${x[0]}</span><span>${x[1]}</span></div>`).join('') + (A.wave<4?`<div class="is-pend"><span class="t">—</span><span style="color:var(--faint)">${A.paused?'paused by m.tremblay':'next: '+waves[Math.min(A.wave+1,3)].n.toLowerCase()}</span></div>`:'');
    $('#advance').disabled = A.wave>=4 || A.paused; $('#advance').textContent = A.wave>=4?'Campaign complete':'Advance wave';
    $('#pause').textContent = A.paused?'Resume rollout':'Pause rollout'; $('#pause').disabled = A.wave>=4;
  };
  const settle=()=>{ if (A.wave>0 && A.wave<4) later(()=>{ mks.forEach(m=>{ if (m.classList.contains('is-dep')) m.classList.replace('is-dep','is-ok'); }); }, 1800); };
  $('#advance').addEventListener('click',()=>{ if (A.wave<4){ A.wave++; paint(); settle(); if (A.wave===4){ later(()=>{ mks.forEach(m=>{ if (m.classList.contains('is-dep')) m.classList.replace('is-dep','is-ok'); }); }, 1800); later(()=>{ mks[OFF].className='mk is-ok is-hero'; $('#health').textContent='complete · 64 on v2.1.0 · kc-gw-01 reconnected and converged'; toast('kc-gw-01 reconnected. Queued deployment converged.'); }, 6000); } } });
  $('#pause').addEventListener('click',()=>{ A.paused=!A.paused; audit(A.paused?'Rollout paused':'Rollout resumed','alarm.correlator v2.1.0'); paint(); });
  $('#rollback').addEventListener('click',()=>{ $('#rb-msg').innerHTML='Rollback request recorded · needs 1 approval · nothing changes on any node until approved.'; });
  mks.forEach(m=>m.addEventListener('click',()=>{ const s=D.sites[m.dataset.i]; toast(`${s.name} · ${s.type} · ${m.classList.contains('is-ok')?'v2.1.0':m.classList.contains('is-q')?'queued, offline':'v2.0.3'}`); }));
  paint(); settle();
};

/* ================= V4: onboarding only, pilot page separated ================= */
ORDER.splice(0,6);
STEPS.pop();
META.pilot.act='After the demo'; META.pilot.crumb='What a pilot looks like · not a product screen';
buildNav = function(){
  const pg=$('#nav-platform').closest('.navgroup'); if (pg) pg.remove();
  const og=$('#nav-onboard').closest('.navgroup'); og.querySelector('.label').textContent='Demo · onboard a site';
  const item=(id,i)=>`<button class="navitem" data-id="${id}"><i>${i}</i>${META[id].nav}</button>`;
  $('#nav-onboard').innerHTML = ORDER.slice(0,-1).map((id,i)=>item(id,String(i+1).padStart(2,'0'))).join('');
  og.insertAdjacentHTML('afterend', `<div class="navgroup nav-after"><span class="label">After the demo</span>${item('pilot','→')}</div>`);
  $$('.navitem').forEach(b=>b.addEventListener('click',()=>go(b.dataset.id)));
};
const v3go = go;
go = function(id){
  if (!ORDER.includes(id)) id = ORDER[0];
  v3go(id);
  const isPilot = id==='pilot';
  $('#rochip').hidden = isPilot; $('#rochip').style.display = isPilot?'none':'';
  $('#acttag').className = 'tag ' + (isPilot ? 'tag--ink' : 'tag--pilot');
  const sc=$('#screen'); sc.classList.toggle('is-pilot', isPilot);
  if (isPilot){ $('.steps',sc)?.remove(); sc.insertAdjacentHTML('afterbegin', `<div class="demo-break"><span class="tag tag--ink">End of product demo</span><p>The screens before this one are the product. This page describes the pilot engagement itself: what happens in Week 1, what we need from you, and what you keep.</p></div>`); }
};
const basePilot = SCREENS.pilot;
SCREENS.pilot = el => {
  basePilot(el);
  $$('.link[data-go]',el).forEach(l=>{ if (l.dataset.go==='fleet'){ l.dataset.go='connect'; l.textContent='Back to the start of the demo'; l.closest('div').querySelector('p').textContent='Replay the onboarding flow from Connect site.'; l.closest('div').querySelector('.label').textContent='Demo'; } else { const s=document.createElement('span'); s.textContent=l.textContent; l.replaceWith(s); } });
};
boot();

</script>
